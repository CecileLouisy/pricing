# Local monitoring of the Pricing service deployed on Render.
#   Prometheus: http://localhost:9090  (collects /metrics every 15 s)
#   Grafana:    http://localhost:3000  (dashboard "Pricing")
# Ports are bound to 127.0.0.1: reachable from this computer only.
#
# Run from this folder: docker compose up -d

# Fixed project name: container, network and volume names do not depend on the folder name.
name: pricing-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: pricing-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    container_name: pricing-grafana
    environment:
      # Dashboards are readable without logging in (local use only).
      # Log in as admin/admin to edit; Grafana asks to change the password on first login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pricing.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

# Named volumes: collected data and Grafana settings survive "docker compose down".
volumes:
  prometheus-data:
  grafana-data:
