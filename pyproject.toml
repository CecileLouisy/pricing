[project]
name = "pricing"
version = "0.1.0"
description = "Pricing microservice for the Parking Management project"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cécile" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "uuid6>=2024.7",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "pip-audit>=2.7",
    "radon>=6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "SIM"]
ignore = [
    "E501",
    "B008",   # Depends() in defaults is idiomatic FastAPI
    "N818",   # domain errors inherit DomainError, suffix is redundant
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    # Starlette pre-announces migration to httpx2; not our concern.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
