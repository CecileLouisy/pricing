services:
  - type: web
    name: pricing
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENV
        value: production
      # Neon PostgreSQL connection string, contains the password: set in the dashboard.
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      # One API key per calling service (X-API-Key header on POST /quote, GET /quotes/{id}).
      - key: BOOKING_API_KEY
        generateValue: true
      - key: ACCESS_API_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "https://cecilelouisy.github.io"
      - key: LOG_LEVEL
        value: INFO
